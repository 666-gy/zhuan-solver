<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>砖了个砖 · 本地求解器</title>
<style>
  :root{
    --paper:#f5f3ee; --card:#fff; --line:#e5e1d6; --ink:#1c2430; --dim:#6b7280;
    --green:#14532d; --green-2:#166534; --green-soft:#e9f2ea;
    --blue:#2563eb; --blue-soft:#e8efff; --amber:#d97706; --red:#dc2626;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  header{height:58px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;
    position:sticky;top:0;z-index:20}
  .brand{font-weight:800;letter-spacing:.06em;color:var(--green);font-size:1.15rem}
  .hdr{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;background:var(--paper);white-space:nowrap}
  .chip.ok{color:var(--green);border-color:#c9dfcd;background:var(--green-soft)}

  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
    padding:8px 14px;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#cfc9ba;background:#faf8f2}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .btn.primary:hover{background:#0f3f22}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .btn.blue:hover{background:#1d4ed8}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .pill-group{display:flex;align-items:center;background:var(--green);border-radius:999px;
    padding:4px;box-shadow:0 2px 10px rgba(20,83,45,.16)}
  .pill-btn{position:relative;width:36px;height:36px;padding:0;border:0;border-radius:999px;
    background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .pill-btn svg{width:19px;height:19px}
  .pill-btn:hover{background:rgba(255,255,255,.16)}
  .pill-btn + .pill-btn::before{content:'';position:absolute;left:-1px;top:9px;bottom:9px;
    width:1px;background:rgba(255,255,255,.22)}
  .pill-btn:disabled{opacity:.38;cursor:not-allowed;background:transparent}
  .pill-btn.busy{pointer-events:none}
  .pill-btn.busy svg{opacity:.4}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
  .btn.ghost:hover{background:#f3f0e8;color:var(--ink)}

  main{max-width:940px;margin:0 auto;padding:18px 18px 48px;
    display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
  @media (max-width:940px){ main{grid-template-columns:1fr} }
  body.solo main{grid-template-columns:1fr}
  body.solo aside{display:none}

  /* ---------- 棋盘 ---------- */
  .left{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0;
    max-width:calc((100vh - 250px) * var(--cols,10) / var(--rows,14) + 30px);margin:0 auto}
  .board-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;width:100%}
  .guide{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px}
  body.solo .guide{display:block}
  .guide h2{margin:0 0 14px;font-size:15.5px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
  .guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
  .guide li{display:flex;gap:10px;font-size:13.5px;line-height:1.9;color:var(--dim)}
  .guide .n{flex:0 0 auto;width:20px;height:20px;border-radius:999px;background:var(--green-soft);
    color:var(--green);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:4px}
  .guide .txt{flex:1}
  .guide b{color:var(--ink);font-weight:700}
  .mini-btn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
    background:var(--green);color:#fff;vertical-align:-7px;margin:0 3px;
    box-shadow:0 1px 3px rgba(20,83,45,.22)}
  .mini-btn svg{width:15px;height:15px}
  .stage{position:relative;border-radius:12px;background:#eef1f4;
    display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden;
    border:1px solid #e3e7ec}
  .stage.over{outline:2px dashed var(--green);outline-offset:-6px}
  .drop-hint{flex:1;width:100%;color:var(--dim);font-size:13.5px;text-align:center;line-height:2;padding:30px 20px}
  .drop-hint b{color:var(--green)}

  #board[hidden]{display:none}
  #board{position:relative;display:grid;gap:3px;padding:6px;width:100%;
    max-width:min(100%, calc((100vh - 250px) * var(--cols,10) / var(--rows,14)));
    margin:0 auto}
  .cell{position:relative;aspect-ratio:1/1;border-radius:7px;background:#f2f4f6;
    overflow:hidden;transition:transform .1s, box-shadow .12s}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell.empty{background:repeating-linear-gradient(45deg,#eef1f4,#eef1f4 6px,#e9edf1 6px,#e9edf1 12px)}
  .cell.empty img{display:none}
  .cell.sel{box-shadow:0 0 0 3px var(--blue);z-index:5}

  #overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:4}

  /* ---------- 右栏 ---------- */
  .side{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px}
  .card h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em}

  .step-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .counter{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .counter b{font-size:26px;color:var(--green);font-weight:800;letter-spacing:-.02em}
  .bar{height:6px;border-radius:999px;background:#eef0ea;margin:12px 0 16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#22c55e);
    border-radius:999px;transition:width .25s}

  .instr{display:flex;align-items:center;gap:12px;min-height:64px}
  .instr .thumb{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);
    background:#fafaf6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .instr .thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px}
  .instr .thumb.empty{border-style:dashed}
  .pill{flex:1;background:var(--blue);color:#fff;border-radius:999px;padding:13px 18px;
    font-size:20px;font-weight:800;letter-spacing:.02em;text-align:center;
    box-shadow:0 4px 14px rgba(37,99,235,.22)}
  .pill.gray{background:#eef0f3;color:var(--dim);box-shadow:none;font-size:15px;font-weight:600}
  .pill .arw{font-size:22px;margin-right:6px}
  .sub{margin:12px 0 0;font-size:12.5px;color:var(--dim);line-height:1.7}
  #tip:empty{display:none}
  .sub b{color:var(--ink);font-weight:600}

  .board-foot[hidden]{display:none}
  .board-foot{display:flex;align-items:center;gap:12px;margin-top:12px;padding:0 2px}
  .round-btn{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:#374151;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .round-btn svg{width:18px;height:18px}
  .round-btn:hover{border-color:#cfc9ba;background:#faf8f2;color:var(--ink)}
  .round-btn:disabled{opacity:.35;cursor:not-allowed;background:#fff;color:#9aa1a9}
  #range{flex:1;min-width:60px;accent-color:#16a34a;height:4px}
  .round-btn.done{width:auto;padding:0 16px;border-radius:999px;background:var(--green);
    border-color:var(--green);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;
    letter-spacing:.02em}
  .round-btn.done:hover{background:#0f3f22;border-color:#0f3f22;color:#fff}

  .play{display:flex;align-items:center;gap:10px}
  .play .btn{flex-shrink:0}
  .play .btn.big{padding:11px 14px;font-size:14px}
  #range{flex:1;min-width:60px;accent-color:#16a34a;height:4px}

  .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tools .btn{width:100%}

  /* 物品 / 校准 */
  .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;
    max-height:32vh;overflow:auto;margin-top:4px}
  .item{position:relative;border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px;cursor:pointer}
  .item:hover{border-color:#cfc9ba}
  .item[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
  .item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block}
  .item .c{position:absolute;right:5px;bottom:4px;font-family:var(--mono);font-size:10px;
    background:rgba(255,255,255,.88);border-radius:4px;padding:0 3px;color:var(--dim)}
  .calib{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .calib summary{cursor:pointer;font-size:12.5px;color:var(--dim);outline:none}
  .calib .row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--dim)}
  .calib input[type=range]{flex:1;accent-color:var(--green)}
  .calib .v{font-family:var(--mono);width:44px;text-align:right;color:var(--ink)}

  #steps{list-style:none;margin:10px 0 0;padding:0;max-height:230px;overflow:auto;
    border-top:1px solid var(--line)}
  #steps li{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #f2efe7;
    font-size:12.5px;cursor:pointer;line-height:1.4}
  #steps li:hover{background:#faf8f2}
  #steps li.on{background:var(--green-soft)}
  #steps .k{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:20px;text-align:right}
  #steps .thumbs{display:flex;gap:2px}
  #steps .thumbs img{width:20px;height:20px;border-radius:4px;object-fit:cover}
  #steps .t{flex:1}
  .empty{color:var(--dim);font-size:12.5px;padding:14px 4px}
  .status{font-size:12.5px;color:var(--dim);margin:9px 0 0;line-height:1.6}
  .status:empty{display:none}
  .status.err{color:var(--red)}
  .status b{color:var(--ink);font-weight:700}
  .status.err b{color:inherit}
  @media (max-width:640px){
    header{height:56px;padding:0 14px;gap:10px;flex-wrap:nowrap}
    .brand{font-size:1.05rem}
    .hdr{gap:8px}
    .pill-group{padding:3px}
    .pill-btn{width:34px;height:34px}
    main{padding:12px 12px 36px;gap:12px}
    .board-card{padding:10px}
    .pill{font-size:17px;padding:11px 14px}
    .counter b{font-size:22px}
  }
  code{font-family:var(--mono);background:#efece3;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand">破砖！</div>
  <div class="hdr">
    <input type="file" id="file" accept="image/*" hidden />
    <div class="pill-group">
    <button class="pill-btn" id="btnUpload" title="上传截图" aria-label="上传截图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L18 3C19.6569 3 21 4.3431 21 6L21 18C21 19.6569 19.6569 21 18 21L6 21C4.3431 21 3 19.6569 3 18L3 6C3 4.3431 4.3431 3 6 3ZM3 18L7.9393 13.0607C8.5251 12.4749 9.4749 12.4749 10.0607 13.0607L12.0801 15.0801C12.6079 15.6079 13.4436 15.6673 14.0408 15.2194L15.9592 13.7806C16.5564 13.3327 17.3921 13.3921 17.9199 13.9199L21 17"/><path d="M9.5 7.5C9.5 8.3284 8.8284 9 8 9C7.1716 9 6.5 8.3284 6.5 7.5C6.5 6.6716 7.1716 6 8 6C8.8284 6 9.5 6.6716 9.5 7.5Z" fill="currentColor" stroke="none"/></svg></button>
    <button class="pill-btn" id="btnAgain" title="重新识别" aria-label="重新识别" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7883 13.9407C20.929 13.3034 21 12.6527 21 12C21 7.0294 16.9706 3 12 3C9.5169 3 7.1441 4.0259 5.4432 5.8349M4.2857 3L4.7293 6.105C4.7683 6.3784 5.0216 6.5683 5.295 6.5293L8.4 6.0857M3.2117 10.0593C3.071 10.6966 3 11.3473 3 12C3 16.9706 7.0294 21 12 21C14.4831 21 16.8559 19.9741 18.5568 18.1651M19.7143 21L19.2707 17.895C19.2317 17.6216 18.9784 17.4317 18.705 17.4707L15.6 17.9143"/></svg></button>
    <button class="pill-btn" id="btnSolve" title="求解" aria-label="求解" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.3184 20.5112L3.0341 3.9139C2.8602 3.3677 3.3816 2.8558 3.9268 3.0373L20.5197 8.5617C21.1361 8.7669 21.1671 9.6243 20.5672 9.8732L13.4774 12.8146C13.3157 12.8817 13.1848 13.0065 13.1107 13.1647L9.6254 20.596C9.3541 21.174 8.5121 21.1195 8.3184 20.5112Z"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="left">
  <section class="board-card">
    <div class="stage" id="stage">
      <img id="shot" alt="" style="display:none" />
      <div class="drop-hint" id="dropHint">
        你尚未上传棋盘截图。<br />
        点击右上角图像按钮上传截图。
      </div>
      <div id="board" hidden></div>
      <svg id="overlay"></svg>
    </div>

    <div class="board-foot" id="boardFoot" hidden>
      <button class="round-btn" id="prev" title="上一步" aria-label="上一步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5.94129M11.8771 5L5.17385 11.5875C4.94205 11.8153 4.94205 12.1847 5.17385 12.4125L11.8771 19"/></svg></button>
      <input type="range" id="range" min="0" max="0" value="0" />
      <button class="round-btn" id="next" title="下一步" aria-label="下一步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12H18.0587M12.1229 5L18.8261 11.5875C19.058 11.8153 19.058 12.1847 18.8261 12.4125L12.1229 19"/></svg></button>
    </div>

    <p class="status" id="status"></p>
  </section>

  <section class="guide" id="guide">
    <h2>怎么使用本辅助：</h2>
    <ol>
      <li>
        <span class="n">1</span>
        <span class="txt">点击右上角 <span class="mini-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L18 3C19.6569 3 21 4.3431 21 6L21 18C21 19.6569 19.6569 21 18 21L6 21C4.3431 21 3 19.6569 3 18L3 6C3 4.3431 4.3431 3 6 3ZM3 18L7.9393 13.0607C8.5251 12.4749 9.4749 12.4749 10.0607 13.0607L12.0801 15.0801C12.6079 15.6079 13.4436 15.6673 14.0408 15.2194L15.9592 13.7806C16.5564 13.3327 17.3921 13.3921 17.9199 13.9199L21 17"/><path d="M9.5 7.5C9.5 8.3284 8.8284 9 8 9C7.1716 9 6.5 8.3284 6.5 7.5C6.5 6.6716 7.1716 6 8 6C8.8284 6 9.5 6.6716 9.5 7.5Z" fill="currentColor" stroke="none"/></svg></span> <b>图像按钮</b>，上传<b>棋盘截图</b>。</span>
      </li>
      <li>
        <span class="n">2</span>
        <span class="txt">确认<b>棋盘识别正常</b>，随后点击右上角 <span class="mini-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.3184 20.5112L3.0341 3.9139C2.8602 3.3677 3.3816 2.8558 3.9268 3.0373L20.5197 8.5617C21.1361 8.7669 21.1671 9.6243 20.5672 9.8732L13.4774 12.8146C13.3157 12.8817 13.1848 13.0065 13.1107 13.1647L9.6254 20.596C9.3541 21.174 8.5121 21.1195 8.3184 20.5112Z"/></svg></span> <b>发送按钮</b>，<b>开始破砖</b>。</span>
      </li>
      <li>
        <span class="n">3</span>
        <span class="txt">如果你发现<b>识别有问题</b>，可尝试点击右上角 <span class="mini-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7883 13.9407C20.929 13.3034 21 12.6527 21 12C21 7.0294 16.9706 3 12 3C9.5169 3 7.1441 4.0259 5.4432 5.8349M4.2857 3L4.7293 6.105C4.7683 6.3784 5.0216 6.5683 5.295 6.5293L8.4 6.0857M3.2117 10.0593C3.071 10.6966 3 11.3473 3 12C3 16.9706 7.0294 21 12 21C14.4831 21 16.8559 19.9741 18.5568 18.1651M19.7143 21L19.2707 17.895C19.2317 17.6216 18.9784 17.4317 18.705 17.4707L15.6 17.9143"/></svg></span> <b>刷新按钮</b>重新识别。</span>
      </li>
    </ol>
  </section>
  </div>

  <aside class="side" id="side">
    <section class="card" id="stepCard">
      <div class="step-head">
        <h2>通关步骤</h2>
        <div class="counter"><b id="curStep">0</b> / <span id="totStep">0</span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="instr">
        <div class="thumb empty" id="instrThumb"></div>
        <div class="pill gray" id="instrPill">点右上角光标按钮求解</div>
      </div>
      <p class="sub" id="tip"></p>
    </section>

    <section class="card" id="editCard" hidden>
      <h2>物品 <span class="counter" id="itemCount"></span></h2>
      <div class="palette" id="palette"><p class="empty">识别后这里会列出每种物品。</p></div>
      <p class="sub">点格子选中，再点物品即可改判；双击物品可改名。</p>
    </section>

    <ul id="steps" hidden></ul>

<script>
(function(){
  'use strict';

  const $ = (s) => document.querySelector(s);
  const boardEl = $('#board'), stageEl = $('#stage'), statusEl = $('#status');
  const paletteEl = $('#palette'), stepsEl = $('#steps'), overlayEl = $('#overlay');

  /* ============ 状态 ============ */
  let img = null;
  let rows = 14, cols = 10;
  let box = { l: 0, t: 0, w: 100, h: 100 };
  let grid = null;
  let labels = null;
  let items = [];
  let selItem = -1;
  let selCell = -1;
  let steps = [];          // 求解结果
  let stepIdx = -1;        // 当前步（0 基）
  let baseCells = null;    // 初始棋盘（物品 id，-1 为空）
  let editing = false;
  let NEXT_ICON = '';
  let lastReco = '';

  // 移动端对大 canvas 的 getImageData 会失败或返回空数据，统一先缩到安全尺寸
  const MAX_SIDE = 1600;
  let srcCanvas = null, srcW = 0, srcH = 0;
  function prepareSource(im){
    const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    srcW = Math.max(1, Math.round(w * s));
    srcH = Math.max(1, Math.round(h * s));
    const cv = document.createElement('canvas');
    cv.width = srcW; cv.height = srcH;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(im, 0, 0, srcW, srcH);
    srcCanvas = cv;
  }
  let result = null, active = -1;   // 兼容核心识别流程里的旧字段

  const S = 28;
  const OFFS = [];
  for (const dy of [-4.5, -1.5, 1.5, 4.5])
    for (const dx of [-4.5, -1.5, 1.5, 4.5]) OFFS.push([dx, dy]);
  const ASSIGN = 0.88;
  const MERGE  = 0.90;
  const REF = 4;

  function setStatus(html, isErr){
    statusEl.innerHTML = html;
    statusEl.classList.toggle('err', !!isErr);
  }
  function boxPx(){
    const W = srcW, H = srcH;
    return { x: W*box.l/100, y: H*box.t/100, w: W*box.w/100, h: H*box.h/100 };
  }
  const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

  /* ============ 上传 ============ */
  function acceptFile(file){
    if (!file || !/^image\//.test(file.type)) { setStatus('这个文件不是图片。', true); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      img = im;
      URL.revokeObjectURL(url);
      prepareSource(im);
      autoDetect();
      $('#btnAgain').disabled = false;
      $('#btnSolve').disabled = false;
      recognize();
    };
    im.onerror = () => setStatus('图片读不出来，换一张 JPG / PNG 试试。', true);
    im.src = url;
  }

  $('#btnUpload').onclick = () => $('#file').click();
  $('#file').onchange = (e) => { const f = e.target.files && e.target.files[0]; if (f) acceptFile(f); e.target.value = ''; };
  stageEl.addEventListener('dragover', (e) => { e.preventDefault(); stageEl.classList.add('over'); });
  stageEl.addEventListener('dragleave', () => stageEl.classList.remove('over'));
  stageEl.addEventListener('drop', (e) => {
    e.preventDefault(); stageEl.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) acceptFile(f);
  });
  window.addEventListener('paste', (e) => {
    const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith('image/'));
    if (it) acceptFile(it.getAsFile());
  });

  function autoDetect(){
    const W = srcW, H = srcH;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(srcCanvas, 0, 0);
    const d = cx.getImageData(0, 0, W, H).data;

    // ---------- 只依赖两条与配色无关的信号 ----------
    // 1) 梯度：格线和图标边缘都会留痕
    // 2) 质心：每格里“偏离底色”的那团东西就是图标
    const hist = new Map();
    for (let i = 0; i < d.length; i += 36){
      const k = ((d[i] >> 3) << 10) | ((d[i+1] >> 3) << 5) | (d[i+2] >> 3);
      hist.set(k, (hist.get(k) || 0) + 1);
    }
    let bk = 0, bv = -1;
    for (const [k, v] of hist) if (v > bv){ bv = v; bk = k; }
    const bg = { r: ((bk >> 10) & 31) * 8 + 4, g: ((bk >> 5) & 31) * 8 + 4, b: (bk & 31) * 8 + 4 };

    const weightAt = (x, y) => {
      const i = (y * W + x) * 4;
      const dd = Math.max(Math.abs(d[i] - bg.r), Math.abs(d[i+1] - bg.g), Math.abs(d[i+2] - bg.b));
      return dd > 22 ? dd - 22 : 0;
    };

    const cellCentroid = (x0, y0, w, h) => {
      if (!(w > 6 && h > 6)) return null;
      let sx = 0, sy = 0, sw = 0;
      const ix0 = Math.max(0, Math.round(x0 + w * 0.10));
      const ix1 = Math.min(W, Math.round(x0 + w * 0.90));
      const iy0 = Math.max(0, Math.round(y0 + h * 0.10));
      const iy1 = Math.min(H, Math.round(y0 + h * 0.90));
      for (let y = iy0; y < iy1; y += 3){
        for (let x = ix0; x < ix1; x += 3){
          const wgt = weightAt(x, y);
          if (!wgt) continue;
          sx += wgt * x; sy += wgt * y; sw += wgt;
        }
      }
      if (!(sw > 0)) return null;
      const ccx = sx / sw, ccy = sy / sw;
      return {
        cx: ccx, cy: ccy,
        ex: Math.abs(ccx - (x0 + w / 2)) / w,
        ey: Math.abs(ccy - (y0 + h / 2)) / h,
      };
    };

    // 1) 梯度剖面
    const lum = (i) => d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
    const rowE = new Float64Array(H), colE = new Float64Array(W);

      const b1 = y * W * 4, b2 = (y + 1) * W * 4;
      let s = 0;
      for (let x = 0; x < W; x += 2) s += Math.abs(lum(b1 + x * 4) - lum(b2 + x * 4));
      rowE[y] = s;
    }
    for (let x = 0; x < W - 1; x++){
      let s = 0;
      for (let y = 0; y < H; y += 2) s += Math.abs(lum((y * W + x) * 4) - lum((y * W + x + 1) * 4));
      colE[x] = s;
    }

    // 2) 自相关求周期（只在“总长/格数”附近找，避开倍频）
    const pitchOf = (prof, count, len) => {
      const approx = len / count;
      const lo = Math.max(8, Math.floor(approx * 0.75));
      const hi = Math.min(len - 2, Math.ceil(approx * 1.25));
      if (hi <= lo + 2) return null;
      let mean = 0;
      for (let i = 0; i < len; i++) mean += prof[i];
      mean /= len;
      let bestLag = lo, bestC = -2;
      for (let lag = lo; lag <= hi; lag++){
        let num = 0, da = 0, db = 0;
        for (let i = 0; i + lag < len; i++){
          const a = prof[i] - mean, b = prof[i + lag] - mean;
          num += a * b; da += a * a; db += b * b;
        }
        const c = num / (Math.sqrt(da * db) || 1);
        if (c > bestC){ bestC = c; bestLag = lag; }
      }
      return bestC > 0.25 ? bestLag : null;
    };

    const px = pitchOf(colE, cols, W);
    const py = pitchOf(rowE, rows, H);
    if (!px || !py){ grid = null; box = { l: 0, t: 0, w: 100, h: 100 }; syncCalib(); return; }

    // 3) 相位：在一个周期内扫，选“图标最居中”的偏移
    const coarseErr = (ox, oy) => {
      let err = 0, n = 0;
      for (let r = 0; r < rows; r++){
        for (let c = 0; c < cols; c++){
          const q = cellCentroid(ox + c * px, oy + r * py, px, py);
          if (!q) continue;
          err += q.ex + q.ey; n++;
        }
      }
      return n ? err / n : 9;
    };

    let bestOx = 0, bestOy = 0, bestErr = Infinity;
    for (let i = 0; i < 8; i++){
      for (let j = 0; j < 8; j++){
        const e = coarseErr(i * px / 8, j * py / 8);
        if (e < bestErr){ bestErr = e; bestOx = i * px / 8; bestOy = j * py / 8; }
      }
    }

    // 4) 精修：每列 / 每行质心做最小二乘，偏移与格距一起修正
    const refine = (xs0, ys0) => {
      const cxSum = new Array(cols).fill(0), cxN = new Array(cols).fill(0);
      const cySum = new Array(rows).fill(0), cyN = new Array(rows).fill(0);
      let err = 0, cnt = 0;
      for (let r = 0; r < rows; r++){
        for (let c = 0; c < cols; c++){
          const x0 = xs0[c], x1 = xs0[c+1], y0 = ys0[r], y1 = ys0[r+1];
          const q = cellCentroid(x0, y0, x1 - x0, y1 - y0);
          if (!q) continue;
          cxSum[c] += q.cx; cxN[c]++;
          cySum[r] += q.cy; cyN[r]++;
          err += q.ex + q.ey; cnt++;
        }
      }
      if (!cnt) return null;
      const fitLine = (sums, ns, count) => {
        const kx = [], ky = [];
        for (let k = 0; k < count; k++) if (ns[k] > 0){ kx.push(k); ky.push(sums[k] / ns[k]); }
        if (kx.length < count * 0.7) return null;
        let sx2 = 0, sy2 = 0, sxx = 0, sxy = 0;
        const n = kx.length;
        for (let i = 0; i < n; i++){ sx2 += kx[i]; sy2 += ky[i]; sxx += kx[i]*kx[i]; sxy += kx[i]*ky[i]; }
        const den = n * sxx - sx2 * sx2;
        if (!den) return null;
        const pb = (n * sxy - sx2 * sy2) / den;
        const pa = (sy2 - pb * sx2) / n;
        return pb > 4 ? { center0: pa, pitch: pb } : null;
      };
      const fx = fitLine(cxSum, cxN, cols);
      const fy = fitLine(cySum, cyN, rows);
      if (!fx || !fy) return null;
      const nxs = [], nys = [];
      for (let k = 0; k <= cols; k++) nxs.push(Math.round(fx.center0 - fx.pitch / 2 + fx.pitch * k));
      for (let k = 0; k <= rows; k++) nys.push(Math.round(fy.center0 - fy.pitch / 2 + fy.pitch * k));
      for (let k = 1; k < nxs.length; k++) if (nxs[k] <= nxs[k-1]) nxs[k] = nxs[k-1] + 1;
      for (let k = 1; k < nys.length; k++) if (nys[k] <= nys[k-1]) nys[k] = nys[k-1] + 1;
      return { xs: nxs, ys: nys, err: err / cnt };
    };

    const xs = [], ys = [];
    for (let k = 0; k <= cols; k++) xs.push(Math.round(bestOx + px * k));
    for (let k = 0; k <= rows; k++) ys.push(Math.round(bestOy + py * k));
    const best = refine(xs, ys);
    if (!best){ grid = null; box = { l: 0, t: 0, w: 100, h: 100 }; syncCalib(); return; }

    grid = { xs: best.xs, ys: best.ys };
    box = {
      l: Math.max(0, best.xs[0]) / W * 100,
      t: Math.max(0, best.ys[0]) / H * 100,
      w: (best.xs[cols] - best.xs[0]) / W * 100,
      h: (best.ys[rows] - best.ys[0]) / H * 100,
    };
    syncCalib();
  }

  function syncCalib(){
    const set = (id, vid, val) => {
      const a = $('#' + id), b = $('#' + vid);
      if (a) a.value = val;
      if (b) b.textContent = val.toFixed(1) + '%';
    };
    set('cL', 'vL', box.l);
    set('cT', 'vT', box.t);
    set('cW', 'vW', box.w);
    set('cH', 'vH', box.h);
  }

  let calibTimer = null;
  [['cL','vL','l'],['cT','vT','t'],['cW','vW','w'],['cH','vH','h']].forEach(([id, vid, key]) => {
    const el = $('#' + id);
    if (!el) return;
    el.addEventListener('input', (e) => {
      grid = null;
      box[key] = parseFloat(e.target.value);
      $('#' + vid).textContent = box[key].toFixed(1) + '%';
      clearTimeout(calibTimer);
      calibTimer = setTimeout(() => { if (img) recognize(); }, 220);
    });
  });

  /* ============ 切块 + 特征 ============ */
  function cellRect(r, c){
    if (grid && grid.xs.length === cols + 1 && grid.ys.length === rows + 1){
      return { x: grid.xs[c], y: grid.ys[r], w: grid.xs[c+1] - grid.xs[c], h: grid.ys[r+1] - grid.ys[r] };
    }
    const b = boxPx();
    const cw = b.w / cols, ch = b.h / rows;
    return { x: b.x + c * cw, y: b.y + r * ch, w: cw, h: ch };
  }

  function computeVectors(){
    const inset = 0.07;
    const N = 4;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S * N;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    const out = [];
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const q = cellRect(r, c);
        const sx = q.x + q.w * inset, sy = q.y + q.h * inset;
        const sw = q.w * (1 - 2 * inset), sh = q.h * (1 - 2 * inset);
        cx.clearRect(0, 0, cv.width, cv.height);
        OFFS.forEach(([dx, dy], k) => {
          const ox = (k % N) * S, oy = Math.floor(k / N) * S;
          cx.drawImage(srcCanvas, sx + dx, sy + dy, sw, sh, ox, oy, S, S);
        });
        const all = cx.getImageData(0, 0, cv.width, cv.height).data;
        const vs = [];
        for (let k = 0; k < OFFS.length; k++){
          const ox = (k % N) * S, oy = Math.floor(k / N) * S;
          const v = new Float32Array(S * S * 3);
          let mean = 0, j = 0;
          for (let yy = 0; yy < S; yy++){
            const base = ((oy + yy) * cv.width + ox) * 4;
            for (let xx = 0; xx < S; xx++){
              const i = base + xx * 4;
              v[j++] = all[i]; v[j++] = all[i+1]; v[j++] = all[i+2];
              mean += all[i] + all[i+1] + all[i+2];
            }
          }
          mean /= (S * S * 3);
          let n = 0;
          for (let q2 = 0; q2 < v.length; q2++){ v[q2] -= mean; n += v[q2] * v[q2]; }
          n = Math.sqrt(n) || 1;
          for (let q2 = 0; q2 < v.length; q2++) v[q2] /= n;
          vs.push(v);
        }
        out.push(vs);
      }
    }
    return out;
  }

  function simToCenter(vs, center){
    let best = -1;
    for (const v of vs){ const d = dot(v, center); if (d > best) best = d; }
    return best;
  }

  function bestCluster(vs, centers){
    const scored = [];
    for (let k = 0; k < centers.length; k++) scored.push([dot(vs[REF], centers[k]), k]);
    scored.sort((a, b) => b[0] - a[0]);
    let best = -1, bi = -1;
    const top = Math.min(5, scored.length);
    for (let t = 0; t < top; t++){
      const k = scored[t][1];
      const s = simToCenter(vs, centers[k]);
      if (s > best){ best = s; bi = k; }
    }
    return [best, bi];
  }

  /* ============ 聚类 ============ */
  function recognize(){
    if (!img) return;
    const t0 = performance.now();
    setStatus('正在切块并识别…');
    $('#btnAgain').disabled = true;

    requestAnimationFrame(() => setTimeout(() => {
      try{
        const V = computeVectors();
        const n = V.length;
        let centers = [];
        let assign = new Int16Array(n).fill(-1);
        let counts = [];

        for (let i = 0; i < n; i++){
          const [best, bi] = bestCluster(V[i], centers);
          if (best >= ASSIGN){
            assign[i] = bi; counts[bi]++;
          } else {
            centers.push(Float32Array.from(V[i][REF]));
            counts.push(1);
            assign[i] = centers.length - 1;
          }
        }

        for (let iter = 0; iter < 3; iter++){
          const sums = centers.map(() => new Float32Array(S * S * 3));
          const cnt = new Array(centers.length).fill(0);
          for (let i = 0; i < n; i++){
            const k = assign[i];
            if (k < 0) continue;
            const v = V[i][REF], s = sums[k];
            for (let j = 0; j < v.length; j++) s[j] += v[j];
            cnt[k]++;
          }
          centers = sums.map((s, k) => {
            if (!cnt[k]) return centers[k];
            let nn = 0;
            for (let j = 0; j < s.length; j++){ s[j] /= cnt[k]; nn += s[j] * s[j]; }
            nn = Math.sqrt(nn) || 1;
            for (let j = 0; j < s.length; j++) s[j] /= nn;
            return s;
          });
          const na = new Int16Array(n).fill(-1);
          const nc = new Array(centers.length).fill(0);
          for (let i = 0; i < n; i++){
            const [best, bi] = bestCluster(V[i], centers);
            na[i] = bi; nc[bi]++;
          }
          assign = na; counts = nc;
        }

        // 合并被拆开的同类（例如同一物品因半像素相位差异分成了两半）
        let merged = true;
        while (merged){
          merged = false;
          for (let a = 0; a < centers.length && !merged; a++){
            if (!counts[a]) continue;
            const ra = assign.indexOf(a);
            if (ra < 0) continue;
            for (let b = a + 1; b < centers.length; b++){
              if (!counts[b]) continue;
              const rb = assign.indexOf(b);
              if (rb < 0) continue;
              const s = Math.max(simToCenter(V[ra], centers[b]), simToCenter(V[rb], centers[a]));
              if (s > MERGE){
                for (let i = 0; i < n; i++) if (assign[i] === b) assign[i] = a;
                counts[a] += counts[b]; counts[b] = 0;
                merged = true; break;
              }
            }
          }
        }

        const remap = new Map();
        let k = 0;
        for (let i = 0; i < n; i++){
          const old = assign[i];
          if (!remap.has(old)) remap.set(old, k++);
          assign[i] = remap.get(old);
        }
        const total = k;

        const firsts = new Array(total).fill(-1);
        for (let i = 0; i < n; i++) if (firsts[assign[i]] < 0) firsts[assign[i]] = i;
        const thumbs = firsts.map((i) => makeThumb(i));
        const cnts = new Array(total).fill(0);
        for (let i = 0; i < n; i++) cnts[assign[i]]++;

        labels = Int16Array.from(assign);
        items = thumbs.map((thumb, i) => ({ name: '物品 ' + (i + 1), thumb, count: cnts[i] }));
        selItem = -1; selCell = -1;
        result = null; active = -1;
        // 新一盘：清掉上一盘的求解结果与盘面快照，否则棋盘会渲染成旧局面
        steps = []; stepIdx = -1; baseCells = null;
        $('#boardFoot').hidden = true;
        $('#curStep').textContent = '0';
        $('#totStep').textContent = '0';
        $('#bar').style.width = '0%';
        $('#range').max = 0;
        $('#range').value = 0;
        $('#prev').disabled = true;
        setNextDone(false);
        $('#tip').textContent = '';
        $('#instrThumb').className = 'thumb empty';
        $('#instrThumb').innerHTML = '';
        $('#instrPill').className = 'pill gray';
        $('#instrPill').textContent = '点右上角光标按钮求解';
        overlayEl.innerHTML = '';
        stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';

        renderBoard();
        renderPalette();
        document.body.classList.remove('solo');
        $('#boardFoot').hidden = true;
        $('#instrPill').className = 'pill gray';
        $('#instrPill').textContent = '点右上角光标按钮求解';

        const odd = cnts.filter(x => x % 2).length;
        const ms = Math.round(performance.now() - t0);
        const shaky = total > n * 0.4;
        const head = `识别出 <b>${total}</b> 种 · ${n} 格`;
        if (shaky) lastReco = head + ' · 切格可能偏了，重新上传试试';
        else if (odd) lastReco = head + ` · 有 <b>${odd}</b> 种数量为奇数，这盘清不空`;
        else lastReco = head;
        setStatus(lastReco, shaky || odd > 0);
      } catch (err){
        setStatus('识别失败：' + err.message, true);
      } finally {
        $('#btnAgain').disabled = false;
      }
    }, 30));
  }

  function makeThumb(idx){
    const r = Math.floor(idx / cols), c = idx % cols;
    const q = cellRect(r, c);
    const cv = document.createElement('canvas'); cv.width = cv.height = 72;
    const cx = cv.getContext('2d');
    const pad = 0.04;
    cx.drawImage(srcCanvas,
      q.x + q.w * pad, q.y + q.h * pad,
      q.w * (1 - 2 * pad), q.h * (1 - 2 * pad), 0, 0, 72, 72);
    return cv.toDataURL('image/png');
  }

  /* ============ 棋盘渲染 ============ */
  function buildCells(){
    boardEl.hidden = false;
    $('#dropHint').style.display = 'none';
    boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
    boardEl.style.setProperty('--cols', cols);
    const bc = document.querySelector('.left');
    if (bc){ bc.style.setProperty('--cols', cols); bc.style.setProperty('--rows', rows); }
    boardEl.style.setProperty('--rows', rows);
    boardEl.innerHTML = '';
    for (let i = 0; i < rows * cols; i++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.dataset.i = i;
      d.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(d);
    }
  }

  function onCellClick(i){
    if (!editing) return;
    selCell = i;
    [...boardEl.children].forEach((el, k) => el.classList.toggle('sel', k === i));
    if (selItem >= 0) setCell(i, selItem);
  }

  // cells: 物品 id 数组，-1 为空
  function renderState(cells){
    for (let i = 0; i < rows * cols; i++){
      const el = boardEl.children[i];
      if (!el) continue;
      const v = cells ? cells[i] : -1;
      if (v >= 0 && items[v]){
        el.classList.remove('empty');
        if (el.dataset.v !== String(v)){
          el.innerHTML = `<img src="${items[v].thumb}" alt="">`;
          el.dataset.v = v;
        }
      } else {
        el.classList.add('empty');
        if (el.dataset.v !== ''){ el.innerHTML = ''; el.dataset.v = ''; }
      }
    }
  }

  function renderBoard(){
    buildCells();
    renderState(baseCells || labels);
  }

  /* ============ 步骤模拟 ============ */
  function applyStep(cells, st){
    if (st.kind === 'elim'){
      cells[st.a] = -1;
      cells[st.b] = -1;
      return;
    }
    const d = st.dir === 'U' ? -cols : st.dir === 'D' ? cols : st.dir === 'L' ? -1 : 1;
    const src = cells.slice();
    for (const p of (st.pushed || [])) cells[p.to] = src[p.from];
    cells[st.to] = src[st.from];
    for (let k = 0; k < st.dist; k++) cells[st.from + k * d] = -1;
    cells[st.to] = -1;
    cells[st.partner] = -1;
  }

  function stateAt(k){
    const cells = baseCells.slice();
    for (let s = 0; s < k; s++) applyStep(cells, steps[s]);
    return cells;
  }

  const pos = (i) => `第${Math.floor(i / cols) + 1}行第${i % cols + 1}列`;
  function dirText(d){ return { U:'上', D:'下', L:'左', R:'右' }[d] || d; }
  function dirArrow(d){ return { U:'↑', D:'↓', L:'←', R:'→' }[d] || ''; }

  /* ============ 覆盖层 ============ */
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function cellBox(i){
    const el = boardEl.children[i];
    if (!el) return null;
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  }

  function drawOverlay(step){
    const W = boardEl.clientWidth, H = boardEl.clientHeight;
    if (!W || !H) return;
    overlayEl.style.left = boardEl.offsetLeft + 'px';
    overlayEl.style.top = boardEl.offsetTop + 'px';
    overlayEl.setAttribute('width', W);
    overlayEl.setAttribute('height', H);
    overlayEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
    overlayEl.innerHTML = '';
    if (!step) return;

    const mark = (i, color) => {
      const r = cellBox(i);
      if (!r) return;
      overlayEl.appendChild(svgEl('rect', {
        x: r.x + 1.5, y: r.y + 1.5, width: r.w - 3, height: r.h - 3, rx: 7,
        fill: 'none', stroke: color, 'stroke-width': 3,
        'stroke-dasharray': '7 5', 'stroke-linecap': 'round'
      }));
    };
    const center = (i) => { const r = cellBox(i); return { x: r.x + r.w/2, y: r.y + r.h/2 }; };

    if (step.kind === 'elim'){
      mark(step.a, '#dc2626');
      mark(step.b, '#dc2626');
      const a = center(step.a), b = center(step.b);
      overlayEl.appendChild(svgEl('line', {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: '#dc2626', 'stroke-width': 2, 'stroke-dasharray': '6 5'
      }));
      return;
    }

    mark(step.from, '#d97706');
    mark(step.to, '#2563eb');
    if (step.partner != null) mark(step.partner, '#2563eb');

    const a = center(step.from), b = center(step.to);
    overlayEl.appendChild(svgEl('line', {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: '#dc2626', 'stroke-width': 2, 'stroke-dasharray': '6 5'
    }));

    // 方向大箭头
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len > 10){
      const ux = Math.cos(ang), uy = Math.sin(ang);
      const sx = a.x + ux * 14, sy = a.y + uy * 14;
      const ex = b.x - ux * 16, ey = b.y - uy * 16;
      overlayEl.appendChild(svgEl('line', {
        x1: sx, y1: sy, x2: ex, y2: ey,
        stroke: '#2563eb', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: .9
      }));
      const ah = 11;
      const p1 = { x: ex - ux * ah - uy * ah * .6, y: ey - uy * ah + ux * ah * .6 };
      const p2 = { x: ex - ux * ah + uy * ah * .6, y: ey - uy * ah - ux * ah * .6 };
      overlayEl.appendChild(svgEl('polygon', {
        points: `${ex},${ey} ${p1.x},${p1.y} ${p2.x},${p2.y}`,
        fill: '#2563eb', opacity: .9
      }));
    }
  }

  /* ============ 步骤 UI ============ */
  function setStep(k){
    if (!steps.length) return;
    stepIdx = Math.max(0, Math.min(k, steps.length - 1));
    const st = steps[stepIdx];

    renderState(stateAt(stepIdx));
    drawOverlay(st);

    const total = steps.length;
    $('#curStep').textContent = stepIdx + 1;
    $('#totStep').textContent = total;
    $('#bar').style.width = ((stepIdx + 1) / total * 100).toFixed(1) + '%';
    $('#range').max = total - 1;
    $('#range').value = stepIdx;

    // 指令
    const thumb = $('#instrThumb');
    const pill = $('#instrPill');
    if (st.kind === 'elim'){
      const t = thumbOf(st.a);
      thumb.className = 'thumb';
      thumb.innerHTML = t ? `<img src="${t}" alt="">` : '';
      pill.className = 'pill';
      pill.innerHTML = '<span class="arw">✕</span>点击消除这两块';
    } else {
      const t = thumbOf(st.from);
      thumb.className = 'thumb';
      thumb.innerHTML = t ? `<img src="${t}" alt="">` : '';
      pill.className = 'pill';
      pill.innerHTML = `<span class="arw">${dirArrow(st.dir)}</span>${dirText(st.dir)}滑 ${st.dist} 格`;
    }

    $('#tip').innerHTML = `第 <b>${stepIdx + 1}</b> 步：` +
      (st.kind === 'elim'
        ? `点掉 <b>${pos(st.a)}</b> 和 <b>${pos(st.b)}</b> 这两块。`
        : `把 <b>${pos(st.from)}</b> 那块向${dirText(st.dir)}滑 <b>${st.dist}</b> 格，和 <b>${pos(st.to)}</b> 合上。`) +
      ' 跟游戏里对不上就按 <b>Esc</b> 改识别结果。';

    $('#prev').disabled = stepIdx <= 0;
    $('#range').disabled = false;
    setNextDone(stepIdx >= total - 1);

    [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === stepIdx));
    const on = stepsEl.children[stepIdx];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  function setNextDone(done){
    const b = $('#next');
    if (!NEXT_ICON) NEXT_ICON = b.innerHTML;
    if (done){
      b.classList.add('done');
      b.innerHTML = '恭喜！再来一盘';
      b.title = '再来一盘';
      b.disabled = false;
    } else {
      b.classList.remove('done');
      b.innerHTML = NEXT_ICON;
      b.title = '下一步';
      b.disabled = false;
    }
  }

  function resetAll(){
    img = null; srcCanvas = null; srcW = 0; srcH = 0;
    grid = null; labels = null; items = [];
    steps = []; stepIdx = -1; baseCells = null; editing = false;
    box = { l: 0, t: 0, w: 100, h: 100 };
    selItem = -1; selCell = -1;

    boardEl.hidden = true;
    boardEl.innerHTML = '';
    overlayEl.innerHTML = '';
    $('#dropHint').style.display = '';
    $('#boardFoot').hidden = true;
    $('#editCard').hidden = true;
    document.body.classList.add('solo');

    $('#curStep').textContent = '0';
    $('#totStep').textContent = '0';
    $('#bar').style.width = '0%';
    $('#instrPill').className = 'pill gray';
    $('#instrPill').textContent = '点右上角光标按钮求解';
    $('#instrThumb').className = 'thumb empty';
    $('#instrThumb').innerHTML = '';
    $('#tip').textContent = '';
    stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';
    $('#status').textContent = '';
    $('#status').classList.remove('err');
    lastReco = '';

    $('#btnSolve').disabled = true;
    $('#btnAgain').disabled = true;
    $('#btnSolve').classList.remove('busy');
    $('#range').max = 0;
    $('#range').value = 0;
    setNextDone(false);
    $('#prev').disabled = true;
    $('#file').value = '';
  }

  function thumbOf(i){
    const v = labels ? labels[i] : -1;
    return v >= 0 && items[v] ? items[v].thumb : null;
  }

  function stepText(s){
    if (s.kind === 'elim') return `消除 ${pos(s.a)} ↔ ${pos(s.b)}`;
    return `${pos(s.from)} 向${dirText(s.dir)}滑 ${s.dist} 格 → ${pos(s.to)}`;
  }

  function renderSteps(){
    stepsEl.innerHTML = '';
    if (!steps.length){ stepsEl.innerHTML = '<li class="empty">没有可执行的步骤。</li>'; return; }
    steps.forEach((s, idx) => {
      const li = document.createElement('li');
      const a = s.kind === 'elim' ? s.a : s.from;
      const b = s.kind === 'elim' ? s.b : s.to;
      const ta = thumbOf(a), tb = thumbOf(b);
      li.innerHTML = `<span class="k">${idx + 1}</span>` +
        `<span class="thumbs">${ta ? `<img src="${ta}" alt="">` : ''}${tb ? `<img src="${tb}" alt="">` : ''}</span>` +
        `<span class="t">${stepText(s)}</span>`;
      li.onclick = () => setStep(idx);
      stepsEl.appendChild(li);
    });
  }

  /* ============ 求解 ============ */
  const src = document.getElementById('solver-src').textContent;
  let workerUrl = null;
  function ensureWorkerUrl(){
    if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    return workerUrl;
  }

  function solve(){
    if (!labels){ setStatus('先上传截图。', true); return; }
    const cells = Array.from(labels, (v) => (v >= 0 ? v + 1 : 0));
    if (!cells.some(Boolean)){ setStatus('棋盘是空的。', true); return; }

    const btn = $('#btnSolve');
    btn.disabled = true; btn.classList.add('busy');
    setStatus('正在搜索…');

    const w = new Worker(ensureWorkerUrl(), { type: 'module' });
    w.onmessage = (ev) => {
      const m = ev.data;
      if (m.type === 'progress'){
        const p = typeof m.progress === 'number' ? Math.round(m.progress * 100) + '%' : '';
        setStatus('正在搜索… ' + p);
      } else if (m.type === 'result'){
        w.terminate(); btn.disabled = false; btn.classList.remove('busy');
        onSolved(m.result);
      } else if (m.type === 'error'){
        w.terminate(); btn.disabled = false; btn.classList.remove('busy');
        setStatus('求解器报错：' + m.message, true);
      }
    };
    w.onerror = (e) => {
      w.terminate(); btn.disabled = false; btn.classList.remove('busy');
      setStatus('求解器异常：' + (e.message || '未知错误'), true);
    };
    w.postMessage({
      type: 'solve', rows, cols,
      cells: Uint8Array.from(cells),
      flags: new Uint8Array(rows * cols),
      budgetMs: 8000,
    });
  }

  function onSolved(res){
    const list = res.solved ? res.steps : (res.bestSteps || []);
    steps = list;
    stepIdx = -1;
    window.__z = { steps, labels, items, cols, rows, stateAt, applyStep };
    baseCells = Array.from(labels);   // 物品 id
    editing = false;
    $('#editCard').hidden = true;

    if (res.solved){
      setStatus(lastReco);
    } else if (res.exhausted){
      setStatus(`按当前识别这盘是死局（穷举完也清不空，剩 ${res.bestRemaining ?? '?'} 块）。` +
        ' 如果官网能解，多半是棋盘读错了——点「改识别结果」核对，或用下面的网格校准重识别。', true);
    } else {
      setStatus(`时间不够，只搜到部分结果（剩 ${res.bestRemaining ?? '?'} 块）。`, true);
    }

    renderSteps();
    $('#boardFoot').hidden = !list.length;
    if (list.length){
      setStep(0);
      $('#prev').disabled = true;
      $('#next').disabled = list.length <= 1;
    } else {
      $('#curStep').textContent = '0';
      $('#totStep').textContent = '0';
      $('#bar').style.width = '0%';
      $('#instrPill').className = 'pill gray';
      $('#instrPill').textContent = '没有可执行的步骤';
      $('#instrThumb').className = 'thumb empty';
      $('#instrThumb').innerHTML = '';
    }
  }

  /* ============ 物品面板 ============ */
  function setCell(i, itemIdx){
    if (!labels) return;
    const old = labels[i];
    if (old === itemIdx) return;
    labels[i] = itemIdx;
    if (old >= 0 && items[old]) items[old].count--;
    if (items[itemIdx]) items[itemIdx].count++;
    if (baseCells) baseCells[i] = itemIdx;
    renderState(baseCells || labels);
    renderPalette();
    steps = []; stepIdx = -1;
    $('#boardFoot').hidden = true;
    stepsEl.innerHTML = '<li class="empty">棋盘改过了，点「求解」重新算。</li>';
    $('#prev').disabled = true; $('#next').disabled = true; $('#range').disabled = true;
    $('#instrPill').className = 'pill gray';
    $('#instrPill').textContent = '棋盘已修改，重新求解';
    setStatus(`已把 ${pos(i)} 改成 <b>${items[itemIdx].name}</b>，点「求解」重新算。`);
  }

  function renderPalette(){
    $('#itemCount').textContent = items.length ? `${items.length} 种` : '';
    if (!items.length){ paletteEl.innerHTML = '<p class="empty">识别后这里会列出每种物品。</p>'; return; }
    paletteEl.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('aria-pressed', String(selItem === i));
      b.innerHTML = `<img src="${it.thumb}" alt=""><span class="c">${it.count}</span>`;
      b.title = it.name;
      b.onclick = () => {
        if (selCell >= 0){ selItem = i; setCell(selCell, i); }
        else { selItem = (selItem === i ? -1 : i); renderPalette(); }
      };
      b.ondblclick = () => {
        const name = prompt('给这个物品起个名字', it.name);
        if (name){ it.name = name.trim().slice(0, 8) || it.name; renderPalette(); }
      };
      paletteEl.appendChild(b);
    });
  }

  /* ============ 事件 ============ */
  $('#btnAgain').onclick = recognize;
  $('#btnSolve').onclick = solve;
  $('#prev').onclick = () => setStep(stepIdx - 1);
  $('#next').onclick = () => {
    if ($('#next').classList.contains('done')) { resetAll(); return; }
    setStep(stepIdx + 1);
  };
  $('#range').oninput = (e) => setStep(+e.target.value);

  function toggleEdit(){
    editing = !editing;
    $('#editCard').hidden = !editing;
    selCell = -1;
    [...boardEl.children].forEach(el => el.classList.remove('sel'));
    if (editing) setStatus('点某个格子选中，再点物品即可改判；按 Esc 退出。');
    else if (steps.length) setStatus('改判已结束，点「求解」可重新计算。');
  }

  document.addEventListener('keydown', (e) => {
    if (!steps.length) return;
    if (e.key === 'ArrowLeft'){ e.preventDefault(); setStep(stepIdx - 1); }
    else if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); setStep(stepIdx + 1); }
    else if (e.key === 'Escape'){
      e.preventDefault();
      toggleEdit();
    }
  });

  document.body.classList.add('solo');

  new ResizeObserver(() => {
    if (steps.length && stepIdx >= 0) drawOverlay(steps[stepIdx]);
  }).observe(boardEl);
})();
</script>
</body>
</html>
