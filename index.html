<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>砖了个砖 · 本地求解器</title>
<style>
  :root{
    --paper:#f6f4ef; --card:#fffdf8; --line:#e2ded2; --ink:#1f2937; --dim:#6b7280;
    --green:#14532d; --green-soft:#e8f0e9; --amber:#b45309; --red:#b91c1c; --blue:#1d4ed8;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{height:56px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
  .brand{font-weight:800;letter-spacing:.02em;color:var(--green);font-size:1.05rem;white-space:nowrap}
  .brand small{font-weight:500;color:var(--dim);margin-left:8px;letter-spacing:0}
  .tag{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;background:var(--paper);white-space:nowrap}
  main{max-width:1120px;margin:0 auto;padding:20px 18px 56px;
    display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;align-items:start}
  @media (max-width:900px){ main{grid-template-columns:1fr} }

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel + .panel{margin-top:16px}
  .panel h2{margin:0 0 12px;font-size:.95rem;letter-spacing:.04em;color:var(--green);font-weight:800;
    display:flex;align-items:center;gap:8px}
  .panel h2 .n{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:500}

  .bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
  .bar label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
  input[type=number]{width:54px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#c9c4b6;background:#faf8f2}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .btn.primary:hover{background:#0f3f22}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .stage{position:relative;border:1px dashed #d9d4c6;border-radius:12px;background:#fff;
    min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage.over{border-color:var(--green);background:var(--green-soft)}
  .stage img#shot{display:none}
  .drop-hint{color:var(--dim);font-size:13.5px;text-align:center;line-height:1.9;padding:26px 18px}
  .drop-hint b{color:var(--green)}

  #board[hidden]{display:none}
  #board{display:grid;gap:2px;width:100%;padding:6px;background:#eef4f7;border-radius:10px;
    max-width:min(100%, calc((100vh - 260px) * var(--cols, 10) / var(--rows, 14)));margin:0 auto}
  .cell{position:relative;aspect-ratio:1/1;border-radius:5px;background:#f7f7f2;overflow:hidden;
    cursor:pointer;transition:box-shadow .1s, transform .08s}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .cell:hover{transform:scale(1.05);z-index:2}
  .cell.sel{box-shadow:0 0 0 3px var(--blue);z-index:3}
  .cell.hl{box-shadow:0 0 0 3px var(--amber);z-index:3}
  .cell.hl2{box-shadow:0 0 0 3px var(--blue);z-index:3}

  .calib{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .calib summary{cursor:pointer;font-size:13px;color:var(--dim);outline:none}
  .calib .row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--dim)}
  .calib input[type=range]{flex:1;accent-color:var(--green)}
  .calib .v{font-family:var(--mono);width:44px;text-align:right;color:var(--ink)}

  .palette .empty{grid-column:1/-1}
  .palette{display:grid;max-height:34vh;overflow:auto;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
  .item{position:relative;border:1px solid var(--line);border-radius:9px;background:#fff;
    padding:4px;cursor:pointer;transition:.12s}
  .item:hover{border-color:#c9c4b6}
  .item[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
  .item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block}
  .item .c{position:absolute;right:5px;bottom:16px;font-family:var(--mono);font-size:10px;
    background:rgba(255,255,255,.86);border-radius:4px;padding:0 3px;color:var(--dim)}
  .item .name{display:block;font-size:10.5px;color:var(--dim);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

  .play{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .play .pos{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto}
  #steps{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
  #steps li{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #f0ede4;
    font-size:13px;line-height:1.4;cursor:pointer}
  #steps li:hover{background:#faf8f2}
  #steps li.on{background:var(--green-soft)}
  #steps .k{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:20px;text-align:right}
  #steps .thumbs{display:flex;gap:3px}
  #steps .thumbs img{width:22px;height:22px;border-radius:4px;object-fit:cover}
  #steps .t{flex:1}
  #steps .kind{font-size:10.5px;border-radius:4px;padding:1px 4px;margin-right:4px;font-family:var(--mono)}
  .kind.elim{background:#fdecec;color:#b91c1c}
  .kind.slide{background:#e8eefc;color:#1d4ed8}
  .empty{color:var(--dim);font-size:13px;padding:16px 4px}

  .status{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.6;min-height:20px}
  .status b{color:var(--ink)}
  .status.err{color:var(--red)}
  .hint{font-size:12px;color:var(--dim);line-height:1.7;margin:10px 0 0}
  @media (max-width:900px){ .palette{max-height:none;overflow:visible} }
  @media (max-width:600px){
    header{padding:0 12px}
    .brand small{display:none}
    .tag{display:none}
    main{padding:14px 12px 40px}
    .palette{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  }
  footer{max-width:1120px;margin:0 auto;padding:0 18px 40px;color:var(--dim);font-size:12px;line-height:1.7}
  code{font-family:var(--mono);background:#efece3;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand">砖了个砖 · 本地求解器<small>引擎取自站内 solver.worker</small></div>
  <div class="tag" id="tag">本地运行 · 不联网</div>
</header>

<main>
  <section class="panel">
    <div class="bar">
      <button class="btn primary" id="btnUpload">上传截图</button>
      <input type="file" id="file" accept="image/*" hidden />
      <label>行 <input type="number" id="rows" min="2" max="20" value="14"></label>
      <label>列 <input type="number" id="cols" min="2" max="20" value="10"></label>
      <button class="btn" id="btnAgain" disabled>重新识别</button>
      <button class="btn" id="btnSolve" disabled>求解</button>
    </div>

    <div class="stage" id="stage">
      <img id="shot" alt="上传的棋盘截图" />
      <div class="drop-hint" id="dropHint">
        把棋盘截图拖进来，或点 <b>上传截图</b>。<br />
        也可以直接 <b>Ctrl+V</b> 粘贴。切块与识别都在本机完成。
      </div>
      <div id="board" hidden></div>
    </div>

    <details class="calib" id="calibBox" hidden>
      <summary>网格校准（识别偏了再动）</summary>
      <div class="row"><span>左</span><input type="range" id="cL" min="0" max="40" step="0.2" value="0"><span class="v" id="vL">0%</span></div>
      <div class="row"><span>上</span><input type="range" id="cT" min="0" max="40" step="0.2" value="0"><span class="v" id="vT">0%</span></div>
      <div class="row"><span>宽</span><input type="range" id="cW" min="30" max="100" step="0.2" value="100"><span class="v" id="vW">100%</span></div>
      <div class="row"><span>高</span><input type="range" id="cH" min="30" max="100" step="0.2" value="100"><span class="v" id="vH">100%</span></div>
    </details>

    <p class="status" id="status">还没有截图。</p>
  </section>

  <aside>
    <section class="panel">
      <h2>物品 <span class="n" id="itemCount"></span></h2>
      <div class="palette" id="palette"><p class="empty">识别后这里会列出每种物品。</p></div>
      <p class="hint">点格子选中，再点物品即可改判；双击物品可改名。</p>
    </section>

    <section class="panel">
      <h2>步骤</h2>
      <div class="play">
        <button class="btn" id="prev">上一步</button>
        <button class="btn" id="play">播放</button>
        <button class="btn" id="next">下一步</button>
        <span class="pos" id="pos">—</span>
      </div>
      <ul id="steps"><li class="empty">还没有求解结果。</li></ul>
    </section>
  </aside>
</main>

<footer>
  求解在你的电脑上完成，不上传截图、不消耗任何积分。引擎文件为
  <code>engine/solver.worker.js</code>，来自 zhuan.zoro.build 的公开前端资源。
</footer>

<script>
(function(){

  const $ = (s) => document.querySelector(s);

  /* ============ 状态 ============ */

  function setStatus(html, isErr){

  }

  $('#btnUpload').onclick = () => $('#file').click();
  $('#file').onchange = (e) => { const f = e.target.files && e.target.files[0]; if (f) acceptFile(f); e.target.value = ''; };
  stageEl.addEventListener('dragover', (e) => { e.preventDefault(); stageEl.classList.add('over'); });
  stageEl.addEventListener('dragleave', () => stageEl.classList.remove('over'));
  stageEl.addEventListener('drop', (e) => {

  window.addEventListener('paste', (e) => {

  /* ============ 自动找棋盘 ============ */

    const W = img.naturalWidth, H = img.naturalHeight;

      for (let k = 1; k < nys.length; k++) if (nys[k] <= nys[k-1]) nys[k] = nys[k-1] + 1;

            const q = stack[--sp];
            const qy = (q / mw) | 0, qx = q % mw;
            area++;
            if (qx < bx0) bx0 = qx;
            if (qx > bx1) bx1 = qx;
            if (qy < by0) by0 = qy;
            if (qy > by1) by1 = qy;
            if (qx > 0){ const n = q - 1; if (mask[n] && labels[n] < 0){ labels[n] = blobs.length; stack[sp++] = n; } }
            if (qx < mw - 1){ const n = q + 1; if (mask[n] && labels[n] < 0){ labels[n] = blobs.length; stack[sp++] = n; } }
            if (qy > 0){ const n = q - mw; if (mask[n] && labels[n] < 0){ labels[n] = blobs.length; stack[sp++] = n; } }
            if (qy < mh - 1){ const n = q + mw; if (mask[n] && labels[n] < 0){ labels[n] = blobs.length; stack[sp++] = n; } }
          }
          if (area > minArea) blobs.push({ x0: bx0, y0: by0, x1: bx1, y1: by1 });
        }
        if (blobs.length >= N * 0.85 && blobs.length <= N * 1.5){
          const fitAxis = (vals, count) => {
            const s = vals.slice().sort((a, b) => a - b);
            const tol = (s[s.length-1] - s[0]) / count * 0.6;
            const groups = [];
            let cur = [s[0]];
            for (let i = 1; i < s.length; i++){
              if (s[i] - cur[cur.length-1] <= tol) cur.push(s[i]);
              else { groups.push(cur); cur = [s[i]]; }
            }
            groups.push(cur);
            if (groups.length !== count) return null;
            const means = groups.map(g => g.reduce((a, b) => a + b, 0) / g.length);
            let sx = 0, sy = 0, sxx = 0, sxy = 0;
            for (let k = 0; k < count; k++){ sx += k; sy += means[k]; sxx += k*k; sxy += k*means[k]; }
            const den = count * sxx - sx * sx;
            if (!den) return null;
            const pb = (count * sxy - sx * sy) / den;
            return pb > 4 ? { center0: (sy - pb * sx) / count, pitch: pb } : null;
          };
          const fx = fitAxis(blobs.map(b => (b.x0 + b.x1) / 2 * step), cols);
          const fy = fitAxis(blobs.map(b => (b.y0 + b.y1) / 2 * step), rows);
          if (fx && fy){
            const xs = [], ys = [];
            for (let k = 0; k <= cols; k++) xs.push(Math.round(fx.center0 - fx.pitch/2 + fx.pitch*k));
            for (let k = 0; k <= rows; k++) ys.push(Math.round(fy.center0 - fy.pitch/2 + fy.pitch*k));
            cands.push({ xs, ys });
          }
        }
      }
    }

    // ---- 方案 B：梯度自相关 ----
    {
      const lum = (i) => d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
      const rowE = new Float64Array(H), colE = new Float64Array(W);
      for (let y = 0; y < H - 1; y++){
        const b1 = y * W * 4, b2 = (y + 1) * W * 4;
        let s = 0;
        for (let x = 0; x < W; x += 2) s += Math.abs(lum(b1 + x * 4) - lum(b2 + x * 4));
        rowE[y] = s;
      }
      for (let x = 0; x < W - 1; x++){
        let s = 0;
        for (let y = 0; y < H; y += 2) s += Math.abs(lum((y * W + x) * 4) - lum((y * W + x + 1) * 4));
        colE[x] = s;
      }
      const axis = (prof, count, len) => {
        const approx = len / count;
        const lo = Math.max(8, Math.floor(approx * 0.8));
        const hi = Math.min(len - 2, Math.ceil(approx * 1.2));
        if (hi <= lo + 2) return null;
        let mean = 0;
        for (let i = 0; i < len; i++) mean += prof[i];
        mean /= len;
        let bestLag = lo, bestC = -2;
        for (let lag = lo; lag <= hi; lag++){
          let num = 0, da = 0, db = 0;
          for (let i = 0; i + lag < len; i++){
            const a = prof[i] - mean, b = prof[i + lag] - mean;
            num += a * b; da += a * a; db += b * b;
          }
          const c = num / (Math.sqrt(da * db) || 1);
          if (c > bestC){ bestC = c; bestLag = lag; }
        }
        const scoreAt = (off, p) => {
          let s = 0, k = 0;
          for (let x = off; x < len - 1; x += p){ s += prof[Math.round(x)]; k++; }
          return k >= 3 ? s : -1;
        };
        let bo = -1, bp = bestLag, bof = 0;
        for (let dp = -2; dp <= 2.0001; dp += 0.1){
          const p = bestLag + dp;
          if (p < lo * 0.9) continue;
          for (let off = 0; off < Math.round(p); off++){
            const s = scoreAt(off, p);
            if (s > bo){ bo = s; bp = p; bof = off; }
          }
        }
        let origin = bof;
        if (origin > bp * 0.6) origin -= bp;
        const out = [];
        for (let k = 0; k <= count; k++) out.push(Math.round(origin + bp * k));
        return out;
      };
      const xs = axis(colE, cols, W), ys = axis(rowE, rows, H);
      if (xs && ys) cands.push({ xs, ys });
    }

    if (!cands.length){ grid = null; box = { l: 0, t: 0, w: 100, h: 100 }; syncCalib(); return; }

    let best = null;
    for (const c of cands){
      const r = refine(c.xs, c.ys);
      if (r && (!best || r.err < best.err)) best = r;
    }
    if (!best){ grid = null; box = { l: 0, t: 0, w: 100, h: 100 }; syncCalib(); return; }

    grid = { xs: best.xs, ys: best.ys };
    box = {
      l: Math.max(0, best.xs[0]) / W * 100,
      t: Math.max(0, best.ys[0]) / H * 100,
      w: (best.xs[cols] - best.xs[0]) / W * 100,
      h: (best.ys[rows] - best.ys[0]) / H * 100,
    };
    syncCalib();
  }

  function syncCalib(){
    $('#cL').value = box.l; $('#vL').textContent = box.l.toFixed(1) + '%';
    $('#cT').value = box.t; $('#vT').textContent = box.t.toFixed(1) + '%';
    $('#cW').value = box.w; $('#vW').textContent = box.w.toFixed(1) + '%';
    $('#cH').value = box.h; $('#vH').textContent = box.h.toFixed(1) + '%';
  }

  let calibTimer = null;
  [['cL','vL','l'],['cT','vT','t'],['cW','vW','w'],['cH','vH','h']].forEach(([id, vid, key]) => {
    $('#' + id).addEventListener('input', (e) => {
      grid = null;
      box[key] = parseFloat(e.target.value);
      $('#' + vid).textContent = box[key].toFixed(1) + '%';
      clearTimeout(calibTimer);
      calibTimer = setTimeout(() => { if (img) recognize(); }, 220);
    });
  });

  /* ============ 切块 + 特征 ============ */
  function cellRect(r, c){
    if (grid && grid.xs.length === cols + 1 && grid.ys.length === rows + 1){
      return { x: grid.xs[c], y: grid.ys[r], w: grid.xs[c+1] - grid.xs[c], h: grid.ys[r+1] - grid.ys[r] };
    }
    const b = boxPx();
    const cw = b.w / cols, ch = b.h / rows;
    return { x: b.x + c * cw, y: b.y + r * ch, w: cw, h: ch };
  }

  function computeVectors(){
    const inset = 0.07;
    const N = 4;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S * N;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    const out = [];
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const q = cellRect(r, c);
        const sx = q.x + q.w * inset, sy = q.y + q.h * inset;
        const sw = q.w * (1 - 2 * inset), sh = q.h * (1 - 2 * inset);
        cx.clearRect(0, 0, cv.width, cv.height);
        OFFS.forEach(([dx, dy], k) => {
          const ox = (k % N) * S, oy = Math.floor(k / N) * S;
          cx.drawImage(img, sx + dx, sy + dy, sw, sh, ox, oy, S, S);
        });
        const all = cx.getImageData(0, 0, cv.width, cv.height).data;
        const vs = [];
        for (let k = 0; k < OFFS.length; k++){
          const ox = (k % N) * S, oy = Math.floor(k / N) * S;
          const v = new Float32Array(S * S * 3);
          let mean = 0, j = 0;
          for (let yy = 0; yy < S; yy++){
            const base = ((oy + yy) * cv.width + ox) * 4;
            for (let xx = 0; xx < S; xx++){
              const i = base + xx * 4;
              v[j++] = all[i]; v[j++] = all[i+1]; v[j++] = all[i+2];
              mean += all[i] + all[i+1] + all[i+2];
            }
          }
          mean /= (S * S * 3);
          let n = 0;
          for (let q2 = 0; q2 < v.length; q2++){ v[q2] -= mean; n += v[q2] * v[q2]; }
          n = Math.sqrt(n) || 1;
          for (let q2 = 0; q2 < v.length; q2++) v[q2] /= n;
          vs.push(v);
        }
        out.push(vs);
      }
    }
    return out;
  }

  function simToCenter(vs, center){
    let best = -1;
    for (const v of vs){ const d = dot(v, center); if (d > best) best = d; }
    return best;
  }

  function bestCluster(vs, centers){
    const scored = [];
    for (let k = 0; k < centers.length; k++) scored.push([dot(vs[REF], centers[k]), k]);
    scored.sort((a, b) => b[0] - a[0]);
    let best = -1, bi = -1;
    const top = Math.min(5, scored.length);
    for (let t = 0; t < top; t++){
      const k = scored[t][1];
      const s = simToCenter(vs, centers[k]);
      if (s > best){ best = s; bi = k; }
    }
    return [best, bi];
  }

  /* ============ 聚类 ============ */
  function recognize(){
    if (!img) return;
    const t0 = performance.now();
    setStatus('正在切块并识别…');
    $('#btnAgain').disabled = true;

    requestAnimationFrame(() => setTimeout(() => {
      try{
        const V = computeVectors();
        const n = V.length;
        let centers = [];
        let assign = new Int16Array(n).fill(-1);
        let counts = [];

        for (let i = 0; i < n; i++){
          const [best, bi] = bestCluster(V[i], centers);
          if (best >= ASSIGN){
            assign[i] = bi; counts[bi]++;
          } else {
            centers.push(Float32Array.from(V[i][REF]));
            counts.push(1);
            assign[i] = centers.length - 1;
          }
        }

        for (let iter = 0; iter < 3; iter++){
          const sums = centers.map(() => new Float32Array(S * S * 3));
          const cnt = new Array(centers.length).fill(0);
          for (let i = 0; i < n; i++){
            const k = assign[i];
            if (k < 0) continue;
            const v = V[i][REF], s = sums[k];
            for (let j = 0; j < v.length; j++) s[j] += v[j];
            cnt[k]++;
          }
          centers = sums.map((s, k) => {
            if (!cnt[k]) return centers[k];
            let nn = 0;
            for (let j = 0; j < s.length; j++){ s[j] /= cnt[k]; nn += s[j] * s[j]; }
            nn = Math.sqrt(nn) || 1;
            for (let j = 0; j < s.length; j++) s[j] /= nn;
            return s;
          });
          const na = new Int16Array(n).fill(-1);
          const nc = new Array(centers.length).fill(0);
          for (let i = 0; i < n; i++){
            const [best, bi] = bestCluster(V[i], centers);
            na[i] = bi; nc[bi]++;
          }
          assign = na; counts = nc;
        }

        // 合并被拆开的同类（例如同一物品因半像素相位差异分成了两半）
        let merged = true;
        while (merged){
          merged = false;
          for (let a = 0; a < centers.length && !merged; a++){
            if (!counts[a]) continue;
            const ra = assign.indexOf(a);
            if (ra < 0) continue;
            for (let b = a + 1; b < centers.length; b++){
              if (!counts[b]) continue;
              const rb = assign.indexOf(b);
              if (rb < 0) continue;
              const s = Math.max(simToCenter(V[ra], centers[b]), simToCenter(V[rb], centers[a]));
              if (s > MERGE){
                for (let i = 0; i < n; i++) if (assign[i] === b) assign[i] = a;
                counts[a] += counts[b]; counts[b] = 0;
                merged = true; break;
              }
            }
          }
        }

        const remap = new Map();
        let k = 0;
        for (let i = 0; i < n; i++){
          const old = assign[i];
          if (!remap.has(old)) remap.set(old, k++);
          assign[i] = remap.get(old);
        }
        const total = k;

        const firsts = new Array(total).fill(-1);
        for (let i = 0; i < n; i++) if (firsts[assign[i]] < 0) firsts[assign[i]] = i;
        const thumbs = firsts.map((i) => makeThumb(i));
        const cnts = new Array(total).fill(0);
        for (let i = 0; i < n; i++) cnts[assign[i]]++;

        labels = Int16Array.from(assign);
        items = thumbs.map((thumb, i) => ({ name: '物品 ' + (i + 1), thumb, count: cnts[i] }));
        selItem = -1; selCell = -1;
        result = null; active = -1;
        stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';
        $('#pos').textContent = '—';

        renderBoard();
        renderPalette();

        const odd = cnts.filter(x => x % 2).length;
        const ms = Math.round(performance.now() - t0);
        const shaky = total > n * 0.4;
        setStatus(`识别出 <b>${total}</b> 种物品，共 ${n} 格，用时 ${ms} ms。` +
          (shaky
            ? ' 种类偏多，可能网格没对齐——展开下面的「网格校准」微调后再点重新识别。'
            : (odd ? ` 有 <b>${odd}</b> 种数量为奇数，这盘清不空。` : ' 每种数量都是偶数，可以解。')));
      } catch (err){
        setStatus('识别失败：' + err.message, true);
      } finally {
        $('#btnAgain').disabled = false;
      }
    }, 30));
  }

  function makeThumb(idx){
    const r = Math.floor(idx / cols), c = idx % cols;
    const q = cellRect(r, c);
    const cv = document.createElement('canvas'); cv.width = cv.height = 72;
    const cx = cv.getContext('2d');
    const pad = 0.04;
    cx.drawImage(img,
      q.x + q.w * pad, q.y + q.h * pad,
      q.w * (1 - 2 * pad), q.h * (1 - 2 * pad), 0, 0, 72, 72);
    return cv.toDataURL('image/png');
  }

  /* ============ 渲染 ============ */
  function renderBoard(){
    boardEl.hidden = false;
    $('#dropHint').style.display = 'none';
    boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
    boardEl.style.setProperty('--cols', cols);
    boardEl.style.setProperty('--rows', rows);
    boardEl.innerHTML = '';
    for (let i = 0; i < rows * cols; i++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.dataset.i = i;
      const lab = labels ? labels[i] : -1;
      if (lab >= 0 && items[lab]) d.innerHTML = `<img src="${items[lab].thumb}" alt="">`;
      d.addEventListener('click', () => {
        selCell = i;
        [...boardEl.children].forEach((el, k) => el.classList.toggle('sel', k === i));
        if (selItem >= 0) setCell(i, selItem);
        else setStatus(`选中第 ${Math.floor(i / cols) + 1} 行第 ${i % cols + 1} 列，点右侧物品可改判。`);
      });
      boardEl.appendChild(d);
    }
  }

  function setCell(i, itemIdx){
    if (!labels) return;
    const old = labels[i];
    if (old === itemIdx) return;
    labels[i] = itemIdx;
    if (old >= 0 && items[old]) items[old].count--;
    if (items[itemIdx]) items[itemIdx].count++;
    boardEl.children[i].innerHTML = `<img src="${items[itemIdx].thumb}" alt="">`;
    renderPalette();
    result = null; active = -1;
    stepsEl.innerHTML = '<li class="empty">棋盘改过了，重新求解。</li>';
    $('#pos').textContent = '—';
    setStatus(`已把 ${pos(i)} 改成 <b>${items[itemIdx].name}</b>，点「求解」重新算。`);
  }

  function renderPalette(){
    $('#itemCount').textContent = items.length ? `${items.length} 种` : '';
    if (!items.length){ paletteEl.innerHTML = '<p class="empty">识别后这里会列出每种物品。</p>'; return; }
    paletteEl.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('aria-pressed', String(selItem === i));
      b.innerHTML = `<img src="${it.thumb}" alt=""><span class="c">${it.count}</span><span class="name">${it.name}</span>`;
      b.onclick = () => {
        if (selCell >= 0){ selItem = i; setCell(selCell, i); }
        else { selItem = (selItem === i ? -1 : i); renderPalette(); }
      };
      b.ondblclick = () => {
        const name = prompt('给这个物品起个名字', it.name);
        if (name){ it.name = name.trim().slice(0, 8) || it.name; renderPalette(); }
      };
      paletteEl.appendChild(b);
    });
  }

  /* ============ 求解 ============ */
  const src = document.getElementById('solver-src').textContent;
  let workerUrl = null;
  function ensureWorkerUrl(){
    if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    return workerUrl;
  }

  function solve(){
    stopPlay();
    if (!labels){ setStatus('先上传截图。', true); return; }
    const cells = Array.from(labels, (v) => (v >= 0 ? v + 1 : 0));
    if (!cells.some(Boolean)){ setStatus('棋盘是空的。', true); return; }

    const btn = $('#btnSolve');
    btn.disabled = true; btn.textContent = '求解中…';
    setStatus('正在搜索…');

    const w = new Worker(ensureWorkerUrl(), { type: 'module' });
    w.onmessage = (ev) => {
      const m = ev.data;
      if (m.type === 'progress'){
        const p = typeof m.progress === 'number' ? Math.round(m.progress * 100) + '%' : '';
        setStatus('正在搜索… ' + p);
      } else if (m.type === 'result'){
        w.terminate(); btn.disabled = false; btn.textContent = '求解';
        showResult(m.result);
      } else if (m.type === 'error'){
        w.terminate(); btn.disabled = false; btn.textContent = '求解';
        setStatus('求解器报错：' + m.message, true);
      }
    };
    w.onerror = (e) => {
      w.terminate(); btn.disabled = false; btn.textContent = '求解';
      setStatus('求解器异常：' + (e.message || '未知错误'), true);
    };
    w.postMessage({
      type: 'solve', rows, cols,
      cells: Uint8Array.from(cells),
      flags: new Uint8Array(rows * cols),
      budgetMs: 8000,
    });
  }

  const pos = (i) => `第${Math.floor(i / cols) + 1}行第${i % cols + 1}列`;
  function stepText(s){
    if (s.kind === 'elim') return `消除 ${pos(s.a)} ↔ ${pos(s.b)}`;
    const dir = { U: '上', D: '下', L: '左', R: '右' }[s.dir] || s.dir;
    return `${pos(s.from)} 向${dir}滑 ${s.dist} 格 → ${pos(s.to)}`;
  }
  function thumbOf(i){
    const lab = labels ? labels[i] : -1;
    return lab >= 0 && items[lab] ? items[lab].thumb : null;
  }

  function showResult(res){
    result = res;
    const steps = res.solved ? res.steps : (res.bestSteps || []);
    active = -1;
    $('#pos').textContent = steps.length ? `0 / ${steps.length}` : '—';

    if (res.solved) setStatus(`解出来了：<b>${steps.length}</b> 步，搜索 ${res.nodes || 0} 个节点，用时 ${res.elapsedMs ?? 0} ms。`);
    else if (res.exhausted) setStatus(`按当前识别这盘是死局（穷举完也清不空，剩 ${res.bestRemaining ?? '?'} 块）。` +
      ' 如果官网能解，多半是棋盘读错了——先核对高亮格，或用「网格校准」微调后重新识别。', true);
    else setStatus(`时间不够，只搜到部分结果（剩 ${res.bestRemaining ?? '?'} 块）。`, true);

    stepsEl.innerHTML = '';
    if (!steps.length){ stepsEl.innerHTML = '<li class="empty">没有可执行的步骤。</li>'; return; }
    steps.forEach((s, idx) => {
      const li = document.createElement('li');
      const a = s.kind === 'elim' ? s.a : s.from;
      const b = s.kind === 'elim' ? s.b : s.to;
      const ta = thumbOf(a), tb = thumbOf(b);
      li.innerHTML = `<span class="k">${idx + 1}</span>` +
        `<span class="thumbs">${ta ? `<img src="${ta}" alt="">` : ''}${tb ? `<img src="${tb}" alt="">` : ''}</span>` +
        `<span class="t"><span class="kind ${s.kind}">${s.kind === 'elim' ? '点击' : '滑动'}</span>${stepText(s)}</span>`;
      li.onclick = () => { stopPlay(); setActive(idx); };
      stepsEl.appendChild(li);
    });
    setActive(0);
  }

  function clearHL(){ for (const el of boardEl.children) el.classList.remove('hl', 'hl2'); }

  function setActive(idx){
    const steps = result ? (result.solved ? result.steps : (result.bestSteps || [])) : [];
    if (!steps.length) return;
    active = Math.max(0, Math.min(idx, steps.length - 1));
    clearHL();
    const s = steps[active];
    const mark = (i, cls) => { const el = boardEl.children[i]; if (el) el.classList.add(cls); };
    if (s.kind === 'elim'){ mark(s.a, 'hl'); mark(s.b, 'hl'); }
    else {
      mark(s.from, 'hl'); mark(s.to, 'hl2');
      if (s.partner != null) mark(s.partner, 'hl2');
      (s.pushed || []).forEach(p => mark(p.from, 'hl2'));
    }
    [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === active));
    const on = stepsEl.children[active];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    $('#pos').textContent = `${active + 1} / ${steps.length}`;
  }

  function stopPlay(){
    if (timer){ clearInterval(timer); timer = null; $('#play').textContent = '播放'; }
  }
  function togglePlay(){
    if (timer){ stopPlay(); return; }
    const steps = result ? (result.solved ? result.steps : (result.bestSteps || [])) : [];
    if (!steps.length) return;
    $('#play').textContent = '暂停';
    timer = setInterval(() => {
      if (active >= steps.length - 1){ stopPlay(); return; }
      setActive(active + 1);
    }, 900);
  }

  /* ============ 事件 ============ */
  $('#rows').onchange = (e) => { rows = Math.max(2, Math.min(20, +e.target.value || 14)); e.target.value = rows; if (img){ grid = null; autoDetect(); recognize(); } };
  $('#cols').onchange = (e) => { cols = Math.max(2, Math.min(20, +e.target.value || 10)); e.target.value = cols; if (img){ grid = null; autoDetect(); recognize(); } };
  $('#btnAgain').onclick = recognize;
  $('#btnSolve').onclick = solve;
  $('#prev').onclick = () => { stopPlay(); setActive(active - 1); };
  $('#next').onclick = () => { stopPlay(); setActive(active + 1); };
  $('#play').onclick = togglePlay;
})();
</script>
</body>
</html>
