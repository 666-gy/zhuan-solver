<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>砖了个砖 · 本地求解器</title>
<style>
  :root{
    --paper:#f6f4ef; --card:#fffdf8; --line:#e2ded2; --ink:#1f2937; --dim:#6b7280;
    --green:#14532d; --green-soft:#e8f0e9; --amber:#b45309; --red:#b91c1c;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{height:56px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
  .brand{font-weight:800;letter-spacing:.02em;color:var(--green);font-size:1.05rem}
  .brand small{font-weight:500;color:var(--dim);margin-left:8px;letter-spacing:0}
  .tag{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;background:var(--paper)}
  main{max-width:1080px;margin:0 auto;padding:22px 18px 60px;
    display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
  @media (max-width:880px){ main{grid-template-columns:1fr} }

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h2{margin:0 0 12px;font-size:.95rem;letter-spacing:.04em;color:var(--green);font-weight:800}

  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .bar label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
  input[type=number]{width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#c9c4b6;background:#faf8f2}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .btn.primary:hover{background:#0f3f22}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .palette{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;
    position:relative}
  .sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
  .sw.erase{background:#fff;border:1px dashed #b9b4a6;color:var(--dim);font-size:11px;
    display:flex;align-items:center;justify-content:center}

  #board{display:grid;gap:4px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:8px;touch-action:none;user-select:none}
  .cell{aspect-ratio:1/1;border-radius:6px;background:#f1efe8;cursor:pointer;
    transition:transform .08s, box-shadow .08s;position:relative}
  .cell:hover{transform:scale(1.04)}
  .cell.hl{box-shadow:0 0 0 3px var(--amber);z-index:2;transform:scale(1.06)}
  .cell.hl2{box-shadow:0 0 0 3px #2563eb;z-index:2}
  .cell .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;color:rgba(0,0,0,.42)}

  .counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-family:var(--mono);font-size:12px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;background:#fff}
  .chip i{width:12px;height:12px;border-radius:4px;display:block}
  .chip.odd{border-color:#f0b4b4;color:var(--red);background:#fdf3f3}

  .status{font-size:13px;color:var(--dim);margin:10px 0 0;min-height:20px;line-height:1.6}
  .status b{color:var(--ink)}
  .status.err{color:var(--red)}

  #steps{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto;
    border-top:1px solid var(--line)}
  #steps li{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #f0ede4;
    font-size:13.5px;line-height:1.45;cursor:pointer}
  #steps li:hover{background:#faf8f2}
  #steps li.on{background:var(--green-soft)}
  #steps .k{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:22px;
    padding-top:2px;text-align:right}
  #steps .t{flex:1}
  #steps .kind{font-size:11px;border-radius:4px;padding:1px 5px;margin-right:6px;
    font-family:var(--mono)}
  .kind.elim{background:#fdecec;color:#b91c1c}
  .kind.slide{background:#e8eefc;color:#1d4ed8}

  .play{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .play .pos{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto}
  .empty{color:var(--dim);font-size:13px;padding:18px 4px}
  footer{max-width:1080px;margin:0 auto;padding:0 18px 40px;color:var(--dim);font-size:12px;line-height:1.7}
  code{font-family:var(--mono);background:#efece3;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand">砖了个砖 · 本地求解器<small>引擎取自站内 solver.worker</small></div>
  <div class="tag" id="engineTag">本地运行 · 不联网</div>
</header>

<main>
  <section class="panel">
    <h2>棋盘</h2>
    <div class="bar">
      <label>行 <input type="number" id="rows" min="2" max="20" value="8"></label>
      <label>列 <input type="number" id="cols" min="2" max="20" value="8"></label>
      <button class="btn" id="clear">清空</button>
      <button class="btn" id="sample">随机示例</button>
      <button class="btn primary" id="solve">求解</button>
    </div>
    <div class="palette" id="palette" role="group" aria-label="图案颜色"></div>
    <div id="board" aria-label="棋盘编辑区"></div>
    <div class="counts" id="counts"></div>
    <p class="status" id="status">左键点涂，按住拖动可连涂；右键擦除。</p>
  </section>

  <section class="panel">
    <h2>步骤</h2>
    <div class="play">
      <button class="btn" id="prev">上一步</button>
      <button class="btn" id="play">播放</button>
      <button class="btn" id="next">下一步</button>
      <span class="pos" id="pos">—</span>
    </div>
    <ul id="steps"><li class="empty">还没有求解结果。</li></ul>
  </section>
</main>

<footer>
  求解在你的电脑上完成，不上传棋盘、不消耗任何积分。引擎文件为
  <code>engine/solver.worker.js</code>，来自 zhuan.zoro.build 的公开前端资源。
</footer>

<script>
(function(){
  const COLORS = ['#e0a49b','#87bfa2','#a3b8e6','#e6d094','#c3a3d8','#9fd4d4','#e8b98a','#b9b3a6'];
  const $ = (s) => document.querySelector(s);
  const boardEl = $('#board'), stepsEl = $('#steps'), statusEl = $('#status'), countsEl = $('#counts');

  let rows = 8, cols = 8;
  let cells = new Array(rows * cols).fill(0);
  let cur = 1;
  let painting = false;
  let result = null;
  let active = -1;
  let timer = null;

  /* ---------- 调色板 ---------- */
  function buildPalette(){
    const p = $('#palette');
    p.innerHTML = '';
    for (let i = 0; i < COLORS.length; i++){
      const b = document.createElement('button');
      b.className = 'sw';
      b.style.background = COLORS[i];
      b.type = 'button';
      b.setAttribute('aria-pressed', String(cur === i + 1));
      b.title = '图案 ' + (i + 1);
      b.onclick = () => { cur = i + 1; buildPalette(); };
      p.appendChild(b);
    }
    const e = document.createElement('button');
    e.className = 'sw erase'; e.type = 'button'; e.textContent = '擦';
    e.title = '擦除（也可以右键）';
    e.onclick = () => { cur = 0; buildPalette(); };
    p.appendChild(e);
  }

  /* ---------- 棋盘 ---------- */
  function buildBoard(){
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0,1fr))';
    boardEl.innerHTML = '';
    for (let i = 0; i < rows * cols; i++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.dataset.i = i;
      d.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        painting = true;
        paint(i, ev.button === 2);
        d.setPointerCapture?.(ev.pointerId);
      });
      d.addEventListener('pointerenter', () => { if (painting) paint(i, false); });
      d.addEventListener('contextmenu', (ev) => { ev.preventDefault(); paint(i, true); });
      boardEl.appendChild(d);
    }
    boardEl.addEventListener('pointerup', () => { painting = false; });
    boardEl.addEventListener('pointerleave', () => { painting = false; });
    render();
  }

  function paint(i, erase){
    const v = erase ? 0 : cur;
    if (cells[i] === v) return;
    cells[i] = v;
    paintCell(i);
    renderCounts();
  }

  function paintCell(i){
    const el = boardEl.children[i];
    if (!el) return;
    const v = cells[i];
    el.style.background = v ? COLORS[(v - 1) % COLORS.length] : '#f1efe8';
    el.classList.toggle('hl', false);
    el.classList.toggle('hl2', false);
  }

  function render(){
    for (let i = 0; i < cells.length; i++) paintCell(i);
    renderCounts();
  }

  function renderCounts(){
    const c = new Array(COLORS.length + 1).fill(0);
    for (const v of cells) if (v) c[v]++;
    countsEl.innerHTML = '';
    let any = false;
    for (let k = 1; k <= COLORS.length; k++){
      if (!c[k]) continue;
      any = true;
      const chip = document.createElement('span');
      chip.className = 'chip' + (c[k] % 2 ? ' odd' : '');
      chip.innerHTML = '<i style="background:' + COLORS[k - 1] + '"></i>' + k + ' × ' + c[k];
      countsEl.appendChild(chip);
    }
    if (!any){
      countsEl.innerHTML = '<span class="chip">棋盘还是空的</span>';
    } else if (countsEl.querySelector('.odd')){
      countsEl.insertAdjacentHTML('beforeend', '<span class="chip odd">有图案数量为奇数，这盘不可能清空</span>');
    }
  }

  /* ---------- 求解 ---------- */
  const src = document.getElementById('solver-src').textContent;
  let workerUrl = null;

  function ensureWorkerUrl(){
    if (!workerUrl){
      workerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
    return workerUrl;
  }

  function solve(){
    stopPlay();
    const filled = cells.filter(Boolean).length;
    if (!filled){
      setStatus('棋盘是空的，先涂几个图案。', true);
      return;
    }
    const btn = $('#solve');
    btn.disabled = true;
    btn.textContent = '求解中…';
    setStatus('正在搜索…');

    const w = new Worker(ensureWorkerUrl(), { type: 'module' });
    const t0 = Date.now();
    w.onmessage = (ev) => {
      const m = ev.data;
      if (m.type === 'progress'){
        const p = typeof m.progress === 'number' ? Math.round(m.progress * 100) + '%' : '';
        setStatus('正在搜索… ' + p);
      } else if (m.type === 'result'){
        w.terminate();
        btn.disabled = false;
        btn.textContent = '求解';
        showResult(m.result, Date.now() - t0);
      } else if (m.type === 'error'){
        w.terminate();
        btn.disabled = false;
        btn.textContent = '求解';
        setStatus('求解器报错：' + m.message, true);
      }
    };
    w.onerror = (e) => {
      w.terminate();
      btn.disabled = false;
      btn.textContent = '求解';
      setStatus('求解器异常：' + (e.message || '未知错误'), true);
    };
    w.postMessage({
      type: 'solve',
      rows, cols,
      cells: Uint8Array.from(cells),
      flags: new Uint8Array(rows * cols),
      budgetMs: 8000,
    });
  }

  function pos(i){ return '第' + (Math.floor(i / cols) + 1) + '行第' + (i % cols + 1) + '列'; }
  function stepText(s){
    if (s.kind === 'elim') return '消除 ' + pos(s.a) + ' ↔ ' + pos(s.b);
    const dir = { U:'上', D:'下', L:'左', R:'右' }[s.dir] || s.dir;
    return pos(s.from) + ' 向' + dir + '滑 ' + s.dist + ' 格 → ' + pos(s.to);
  }

  function showResult(res, ms){
    result = res;
    const steps = res.solved ? res.steps : (res.bestSteps || []);
    active = -1;
    $('#pos').textContent = steps.length ? '0 / ' + steps.length : '—';

    if (res.solved){
      setStatus('解出来了：<b>' + steps.length + '</b> 步，搜索 ' + (res.nodes || 0) + ' 个节点，用时 ' + (res.elapsedMs ?? ms) + ' ms。');
    } else if (res.exhausted){
      setStatus('这盘是死局：穷举完也清不空，剩 ' + (res.bestRemaining ?? '?') + ' 块。' , true);
    } else {
      setStatus('时间不够，只搜到部分结果（剩 ' + (res.bestRemaining ?? '?') + ' 块）。', true);
    }

    stepsEl.innerHTML = '';
    if (!steps.length){
      stepsEl.innerHTML = '<li class="empty">没有可执行的步骤。</li>';
      return;
    }
    steps.forEach((s, idx) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="k">' + (idx + 1) + '</span>' +
        '<span class="t"><span class="kind ' + s.kind + '">' + (s.kind === 'elim' ? '点击' : '滑动') +
        '</span>' + stepText(s) + '</span>';
      li.onclick = () => { stopPlay(); setActive(idx); };
      stepsEl.appendChild(li);
    });
    setActive(0);
  }

  function clearHL(){
    for (const el of boardEl.children){ el.classList.remove('hl', 'hl2'); }
  }

  function setActive(idx){
    const steps = result ? (result.solved ? result.steps : (result.bestSteps || [])) : [];
    if (!steps.length) return;
    active = Math.max(0, Math.min(idx, steps.length - 1));
    clearHL();
    const s = steps[active];
    const mark = (i, cls) => { const el = boardEl.children[i]; if (el) el.classList.add(cls); };
    if (s.kind === 'elim'){
      mark(s.a, 'hl'); mark(s.b, 'hl');
    } else {
      mark(s.from, 'hl'); mark(s.to, 'hl2');
      if (s.partner != null) mark(s.partner, 'hl2');
      (s.pushed || []).forEach(p => mark(p.from, 'hl2'));
    }
    [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === active));
    const on = stepsEl.children[active];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    $('#pos').textContent = (active + 1) + ' / ' + steps.length;
  }

  function stopPlay(){
    if (timer){ clearInterval(timer); timer = null; $('#play').textContent = '播放'; }
  }

  function togglePlay(){
    if (timer){ stopPlay(); return; }
    const steps = result ? (result.solved ? result.steps : (result.bestSteps || [])) : [];
    if (!steps.length) return;
    $('#play').textContent = '暂停';
    timer = setInterval(() => {
      if (active >= steps.length - 1){ stopPlay(); return; }
      setActive(active + 1);
    }, 900);
  }

  function setStatus(html, isErr){
    statusEl.innerHTML = html;
    statusEl.classList.toggle('err', !!isErr);
  }

  /* ---------- 交互 ---------- */
  $('#rows').onchange = (e) => { resize(+e.target.value, cols); };
  $('#cols').onchange = (e) => { resize(rows, +e.target.value); };
  function resize(r, c){
    r = Math.max(2, Math.min(20, r || 8));
    c = Math.max(2, Math.min(20, c || 8));
    const old = cells, oldR = rows, oldC = cols;
    rows = r; cols = c;
    cells = new Array(rows * cols).fill(0);
    for (let y = 0; y < Math.min(oldR, rows); y++)
      for (let x = 0; x < Math.min(oldC, cols); x++)
        cells[y * cols + x] = old[y * oldC + x];
    $('#rows').value = rows; $('#cols').value = cols;
    result = null; active = -1;
    stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';
    $('#pos').textContent = '—';
    buildBoard();
    setStatus('左键点涂，按住拖动可连涂；右键擦除。');
  }

  $('#clear').onclick = () => {
    stopPlay();
    cells = new Array(rows * cols).fill(0);
    result = null; active = -1;
    stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';
    $('#pos').textContent = '—';
    render();
    setStatus('已清空。');
  };

  $('#sample').onclick = () => {
    stopPlay();
    cells = new Array(rows * cols).fill(0);
    const total = rows * cols;
    const pairs = Math.floor(total / 2);
    const pool = [];
    for (let i = 0; i < pairs; i++) pool.push(i % 6 + 1, i % 6 + 1);
    while (pool.length < total) pool.push(0);
    for (let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    cells = pool;
    result = null; active = -1;
    stepsEl.innerHTML = '<li class="empty">还没有求解结果。</li>';
    $('#pos').textContent = '—';
    render();
    setStatus('已生成随机棋盘，点“求解”试试。');
  };

  $('#solve').onclick = solve;
  $('#prev').onclick = () => { stopPlay(); setActive(active - 1); };
  $('#next').onclick = () => { stopPlay(); setActive(active + 1); };
  $('#play').onclick = togglePlay;

  buildPalette();
  buildBoard();
})();
</script>
</body>
</html>
